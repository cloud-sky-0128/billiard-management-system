name: Build Windows Window Preview

on:
  push:
    tags:
      - "window-preview-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-window.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-window.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build window preview package
        shell: pwsh
        run: ./scripts/build_windows_window.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: BilliardManagerWindow-preview
          path: dist/BilliardManagerWindow-preview.zip
          if-no-files-found: error

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist/BilliardManagerWindow-preview.zip).Hash.ToLowerInvariant()
          "$hash  BilliardManagerWindow-preview.zip" | Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Publish preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          "dist/BilliardManagerWindow-preview.zip"
          "dist/SHA256SUMS.txt"
          --prerelease
          --generate-notes
          --title "撞球館管理系統 $env:GITHUB_REF_NAME"
